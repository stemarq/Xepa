# Publicação da API no Render (Blueprint).
#
# Com este arquivo no repositório, o Render lê tudo daqui: em vez de preencher
# o formulário na mão, use New → Blueprint e aponte para o repo.
#
# O banco não entra aqui de propósito: o Postgres é o Supabase, que já existe.
# Só a API sobe.

services:
  - type: web
    name: xepa-api
    runtime: node
    # O repositório tem app/ e api/ lado a lado — sem isto o Render tentaria
    # buildar a raiz e não acharia package.json.
    rootDir: api
    plan: free
    region: oregon

    # `npm ci` e não `yarn`: o repositório tem package-lock.json, e o yarn
    # ignora esse lockfile e resolve as versões de novo por conta própria.
    # O `npm run build` é o que compila o TypeScript — sem ele não existe
    # dist/, e o start falha com MODULE_NOT_FOUND.
    #
    # `--include=dev` é obrigatório por causa do NODE_ENV=production abaixo:
    # com ele, o npm pula as devDependencies, e é lá que estão o typescript e
    # os @types. Sem a flag o tsc roda sem tipo nenhum e o build quebra em
    # ~90 erros de "Cannot find name 'process'" — que parecem erro de código,
    # mas são dependência ausente.
    # O `db:migrate` no fim é o que impede o caso que já aconteceu uma vez:
    # subir código que depende de uma coluna nova contra um schema velho. O
    # `/api/saude` não pega isso — ele confirma que o commit subiu, não que o
    # banco acompanhou, então o healthcheck fica verde e o login estoura 500.
    #
    # É seguro repetir: o runner registra o que aplicou em `schema_migrations`
    # e só roda o que falta, cada arquivo na própria transação. E se o banco
    # estiver inalcançável, o build falha aqui — melhor do que subir a API
    # contra um schema que não bate.
    #
    # Depende do `--include=dev` acima: o runner roda por tsx, que é
    # devDependency. Tirar a flag quebra o build e a migration junto.
    buildCommand: npm ci --include=dev && npm run build && npm run db:migrate
    startCommand: npm start

    # A rota já existe e também toca o banco, então um deploy que sobe sem
    # conseguir falar com o Supabase é reprovado aqui, e não pelo usuário.
    healthCheckPath: /api/saude

    envVars:
      - key: NODE_ENV
        value: production

      # Obrigatória e secreta: `sync: false` faz o Render pedir o valor no
      # painel em vez de guardá-lo no repositório.
      #
      # Use a string do **pooler** do Supabase (porta 6543), com usuário
      # postgres.SEU_REF. A conexão direta é IPv6-only e não serve.
      - key: DATABASE_URL
        sync: false

      # O Supabase exige TLS. Em produção o padrão já seria ligado, mas deixar
      # explícito evita que mudar o NODE_ENV desligue a criptografia sem querer.
      - key: DB_SSL
        value: 'true'

      # Atrás do pooler quem multiplexa é ele; o plano free do Render é
      # pequeno e não precisa segurar muitas conexões.
      - key: DB_POOL_MAX
        value: '5'

      # PLUGGY_CLIENT_ID e PLUGGY_CLIENT_SECRET não são declaradas aqui de
      # propósito: sem elas o serviço sobe no provedor simulado, que é um
      # estado válido. Declará-las como `sync: false` faria todo deploy parar
      # pedindo valor, inclusive quando a integração real não está em uso.
      # Para ligar a Pluggy, adicione as duas no painel do Render — o
      # `openFinanceService` troca de provedor sozinho ao encontrá-las.

      # PORT não é declarada: o Render injeta a dele, e `env.ts` já lê de lá.
