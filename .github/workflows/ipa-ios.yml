# Gera um .ipa **sem assinatura** do cliente, para instalação pessoal.
#
# Por que sem assinatura: a Apple permite instalar o próprio app no próprio
# aparelho com um Apple ID gratuito ("Personal Team"), mas quem assina nesse
# fluxo é o Sideloadly/AltStore, já no Windows. O EAS Build não serve aqui —
# ele exige certificado de distribuição, que só existe em conta paga.
#
# Nenhuma credencial da Apple passa por este workflow. O runner só compila; a
# assinatura acontece na sua máquina, com o seu Apple ID.
#
# Depois de rodar: baixe o artifact, abra o Sideloadly, arraste o .ipa, entre
# com o Apple ID e instale. O certificado gratuito vale 7 dias — o AltStore
# renova sozinho enquanto o PC e o iPhone estiverem na mesma rede.

name: IPA iOS (sem assinatura)

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: >-
          Endereço da API que vai ficar embutido no app. Precisa ser alcançável
          pelo iPhone — o IP da máquina na rede local (http://192.168.x.x:3333/api)
          ou a URL pública, se a API já estiver publicada.
        required: true
        default: https://xepa.onrender.com/api

jobs:
  build:
    # Runner macOS: obrigatório para compilar iOS. Em repositório público não
    # consome cota; em privado, cada minuto conta 10× — por isso o gatilho é
    # manual, e não a cada push.
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      # O Xcode não é livre: 26.2 é a única janela que compila.
      #
      # O expo-modules-jsi 57.0.4 (que vem via expo-modules-core, e é a última
      # da linha do SDK 57) esbarra em duas coisas diferentes, e por isso a
      # versão importa dos dois lados:
      #
      #   26.0        Swift 6.2.0   'weak' must be a mutable variable
      #   26.1/26.1.1 Swift 6.2.1   'weak' must be a mutable variable
      #   26.2        Swift 6.2.3   ok (com o patch)
      #   26.3        Swift 6.2.4   ok (com o patch), mas sem ganho
      #
      # Ele usa `weak let`, aceito só a partir do Swift 6.2.2, o que descarta
      # tudo abaixo de 26.2. E nas versões que aceitam, tropeçava em inferência
      # de tipo no JavaScriptCodable+Date.swift — resolvido em app/patches/
      # (expo-modules-jsi+57.0.4.patch), que o patch-package reaplica no
      # postinstall. Sai quando o Expo publicar o conserto.
      #
      # Não baixe o alvo para uma 26.0/26.1 achando que é mais seguro: o patch
      # não cobre o `weak let`, e são justamente as versões que não compilam.

      - name: Selecionar o Xcode
        env:
          XCODE_ALVO: '26.2'
        run: |
          set -euo pipefail
          echo "Xcodes disponíveis:"
          ls -d /Applications/Xcode*.app

          escolhido=$(ls -d "/Applications/Xcode_${XCODE_ALVO}"*.app 2>/dev/null | sort -V | head -1 || true)
          if [ -z "$escolhido" ]; then
            echo "Xcode ${XCODE_ALVO} não existe nesta imagem; usando a 26.x mais velha"
            escolhido=$(ls -d /Applications/Xcode_26*.app | sort -V | head -1)
          fi

          echo "escolhido: $escolhido"
          sudo xcode-select -s "$escolhido"
          xcodebuild -version
          swift --version

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Instalar dependências
        working-directory: app
        run: npm ci

      - name: Gerar o projeto iOS nativo
        working-directory: app
        env:
          # Entra no bundle em tempo de build. Sem isso o cliente cai no padrão
          # `http://localhost:3333/api`, que no iPhone é o próprio telefone: o
          # app abriria e nunca carregaria dado nenhum.
          EXPO_PUBLIC_API_URL: ${{ inputs.api_url }}
        run: npx expo prebuild --platform ios --clean

      - name: Descobrir o nome do scheme
        id: scheme
        working-directory: app/ios
        # O nome sai do `name` do app.json e pode mudar; ler do disco evita um
        # workflow que quebra em silêncio quando alguém renomeia o app.
        run: |
          scheme=$(ls -d *.xcworkspace | head -1 | sed 's/\.xcworkspace$//')
          echo "nome=$scheme" >> "$GITHUB_OUTPUT"
          echo "scheme: $scheme"

      - name: Compilar sem assinar
        working-directory: app/ios
        env:
          SCHEME: ${{ steps.scheme.outputs.nome }}
          EXPO_PUBLIC_API_URL: ${{ inputs.api_url }}
        # `build` e não `archive`: com a assinatura desligada o archive nem
        # sempre monta a estrutura Products/Applications, e foi exatamente aí
        # que a primeira execução quebrou. O `build` deposita o .app no
        # derivedData, que é previsível.
        #
        # Sem `| xcpretty`: ele pode não existir no runner, e aí o cano quebra
        # e leva o xcodebuild junto — um erro que não parece de build.
        run: |
          set -o pipefail
          # Sem `-sdk iphoneos`: junto com `-destination` ele produz
          # `undefined_arch` nas fases de script, porque as duas opções
          # disputam quem define a arquitetura. O destination sozinho basta.
          xcodebuild build \
            -workspace "$SCHEME.xcworkspace" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/derivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            EXPANDED_CODE_SIGN_IDENTITY=""

      - name: Empacotar como .ipa
        # Um .ipa é só um zip com o .app dentro de uma pasta `Payload/`. Como o
        # binário não está assinado, não dá para usar `xcodebuild -exportArchive`
        # (ele exige um perfil) — daí o empacotamento à mão.
        #
        # O .app é localizado por busca, não por caminho montado: o nome do
        # produto nem sempre é o do scheme, e supor isso foi o que falhou antes.
        run: |
          set -euo pipefail
          produtos="$RUNNER_TEMP/derivedData/Build/Products"

          app=$(find "$produtos" -maxdepth 3 -type d -name '*.app' | head -1)
          if [ -z "$app" ]; then
            echo "Nenhum .app encontrado. Conteúdo de $produtos:"
            find "$produtos" -maxdepth 3 || echo "(a pasta nem existe)"
            exit 1
          fi
          echo "encontrado: $app"

          rm -rf "$RUNNER_TEMP/Payload"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$app" "$RUNNER_TEMP/Payload/"

          cd "$RUNNER_TEMP"
          zip -qry xepa-sem-assinatura.ipa Payload
          ls -lh xepa-sem-assinatura.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: xepa-ipa-sem-assinatura
          path: ${{ runner.temp }}/*.ipa
          retention-days: 14
          if-no-files-found: error
